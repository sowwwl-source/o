<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>baco.work</title>
  <meta name="description" content="baco.work / brand designer - Photographier">
  <style>
    :root {
      --bg: #030303;
      --bg-soft: #0a0a0a;
      --ink: #f6efe4;
      --muted: rgba(246, 239, 228, 0.72);
      --line: rgba(246, 239, 228, 0.12);
      --accent: rgba(246, 239, 228, 0.08);
    }

    * {
      box-sizing: border-box;
      min-width: 0;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at top left, rgba(255, 255, 255, 0.04), transparent 24%),
        radial-gradient(circle at 80% 22%, rgba(255, 255, 255, 0.05), transparent 20%),
        linear-gradient(180deg, var(--bg) 0%, var(--bg-soft) 55%, #000 100%);
      font-family: "Avenir Next", "Helvetica Neue", "Segoe UI", sans-serif;
      letter-spacing: 0.01em;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
      background-size: 42px 42px;
      mask-image: radial-gradient(circle at center, black 24%, transparent 82%);
      pointer-events: none;
      opacity: 0.45;
    }

    main {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .stage {
      width: min(720px, 100%);
      display: grid;
      gap: 1.4rem;
      justify-items: center;
      text-align: center;
      padding: clamp(1.6rem, 4vw, 2.8rem);
      border: 1px solid var(--line);
      border-radius: 28px;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.03), rgba(255, 255, 255, 0.01)),
        rgba(8, 8, 8, 0.78);
      box-shadow: 0 28px 90px rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(14px);
    }

    .logo {
      width: min(240px, 100%);
      display: block;
      height: auto;
    }

    .title {
      margin: 0;
      color: var(--muted);
      font-size: clamp(0.95rem, 2vw, 1.08rem);
      line-height: 1.45;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .contacts {
      display: grid;
      gap: 0.72rem;
      width: 100%;
      justify-items: center;
    }

    .contact {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: fit-content;
      max-width: 100%;
      padding: 0.92rem 1.12rem;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--accent);
      color: var(--ink);
      text-decoration: none;
      font-size: clamp(0.96rem, 2vw, 1.04rem);
      line-height: 1.3;
      transition: transform 180ms ease, border-color 180ms ease, background 180ms ease;
    }

    .contact:hover,
    .contact:focus-visible {
      transform: translateY(-2px);
      border-color: rgba(246, 239, 228, 0.24);
      background: rgba(246, 239, 228, 0.12);
    }

    @media (max-width: 560px) {
      .stage {
        border-radius: 22px;
      }

      .contact {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main>
    <div class="stage">
      <img class="logo" src="./signature-mail.jpg" alt="Signature Baco">

      <p class="title">baco.work / brand designer - Photographier</p>

      <div class="contacts">
        <a class="contact" href="mailto:olivierbaco@gmail.com">olivierbaco@gmail.com</a>
        <a class="contact" href="tel:+33616096509">+33 (0)6 16 09 65 09</a>
      </div>
    </div>
  </main>
</body>
</html>
